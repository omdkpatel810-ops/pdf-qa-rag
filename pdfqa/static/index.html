<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDF Q&amp;A</title>
<style>
:root {
  --bg: #f6f4ef;
  --surface: #fffdf8;
  --ink: #1d1b16;
  --muted: #6b665b;
  --line: #e2ddd1;
  --accent: #1f5f5b;
  --accent-ink: #ffffff;
  --accent-soft: #e2efec;
  --mark: #fbe7a6;
  --warn: #9a3b1f;
  --shadow: 0 1px 2px rgb(30 25 10 / 6%), 0 4px 16px rgb(30 25 10 / 5%);
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #15140f; --surface: #1d1c17; --ink: #ece7db; --muted: #a39d8f; --line: #34322a;
    --accent: #7cc4bc; --accent-ink: #0f1a19; --accent-soft: #1d3331; --mark: #5a4a12; --warn: #f0a080;
    --shadow: none; color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.55 var(--sans); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

header { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; flex-wrap: wrap;
  padding: 18px 28px; border-bottom: 1px solid var(--line); }
.brand { font-family: var(--serif); font-size: 1.45rem; font-weight: 600; letter-spacing: -0.01em; margin: 0; }
.brand span { color: var(--accent); }
.model { font-size: 0.85rem; color: var(--muted); }
.model b { font-weight: 600; color: var(--ink); }

.layout { display: grid; grid-template-columns: 290px minmax(0, 1fr); min-height: calc(100vh - 66px); }
@media (max-width: 820px) {
  .layout { grid-template-columns: minmax(0, 1fr); }
  aside { order: 2; border-right: 0; border-top: 1px solid var(--line); }
  header { padding: 14px 16px; }
}

aside { border-right: 1px solid var(--line); padding: 22px 20px; display: grid; align-content: start; gap: 14px; }
.label { font-size: 0.72rem; font-weight: 600; letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); margin: 0; }
.docs { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.doc { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 6px; padding: 8px 10px; border-radius: 8px; }
.doc:hover { background: var(--surface); }
.doc .t { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.doc .m { grid-column: 1; font-size: 0.8rem; color: var(--muted); }
.doc .x { grid-row: 1 / span 2; grid-column: 2; border: 0; background: none; color: var(--muted); padding: 4px 6px; border-radius: 6px; font-size: 0.8rem; visibility: hidden; }
.doc:hover .x, .doc .x:focus-visible, .doc .x.sure { visibility: visible; }
.doc .x:hover { color: var(--warn); }
.doc .x.sure { color: var(--warn); font-weight: 600; }
.drop { border: 1.5px dashed var(--line); border-radius: 10px; padding: 18px 14px; text-align: center; color: var(--muted); font-size: 0.9rem; display: grid; gap: 8px; justify-items: center; }
.drop.over { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); }
.drop button { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 6px 14px; font-weight: 600; }
.progress { display: grid; gap: 6px; font-size: 0.85rem; }
.bar { height: 5px; background: var(--line); border-radius: 3px; overflow: hidden; }
.bar span { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.2s; }
.note { font-size: 0.85rem; color: var(--muted); margin: 0; }
.note.err { color: var(--warn); }

main { padding: 28px clamp(16px, 4vw, 56px) 64px; display: grid; align-content: start; gap: 26px; max-width: 920px; }
form.ask { display: grid; gap: 10px; }
.ask-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; }
.ask input[type=text] { width: 100%; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); font-size: 1.05rem; }
.ask button.go { border: 0; border-radius: 12px; padding: 0 22px; background: var(--accent); color: var(--accent-ink); font-weight: 650; }
.ask button.go:disabled { opacity: 0.55; cursor: default; }
.scope { display: flex; gap: 8px; align-items: center; font-size: 0.88rem; color: var(--muted); }
.scope select { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 3px 8px; max-width: 100%; }

.empty { border: 1px solid var(--line); border-radius: 14px; background: var(--surface); padding: 28px; display: grid; gap: 8px; }
.empty h2 { font-family: var(--serif); font-weight: 600; font-size: 1.35rem; margin: 0; }
.empty p { margin: 0; color: var(--muted); }
.tries { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 6px; }
.tries button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 5px 12px; font-size: 0.88rem; }
.tries button:hover { border-color: var(--accent); }

.turn { display: grid; gap: 14px; }
.q { font-family: var(--serif); font-size: 1.4rem; font-weight: 600; line-height: 1.3; margin: 0; letter-spacing: -0.005em; }
.a { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 20px 22px; box-shadow: var(--shadow); display: grid; gap: 12px; }
.a .text { font-family: var(--serif); font-size: 1.12rem; line-height: 1.65; white-space: pre-wrap; margin: 0; }
.a .text.waiting { color: var(--muted); font-family: var(--sans); font-size: 0.95rem; }
.a .text.nothing { color: var(--muted); }
.cite { display: inline-flex; align-items: center; justify-content: center; min-width: 1.45em; height: 1.45em; padding: 0 0.35em; margin: 0 1px;
  border: 0; border-radius: 6px; background: var(--accent-soft); color: var(--accent); font: 650 0.72rem/1 var(--sans); vertical-align: 0.18em; }
.cite:hover { background: var(--accent); color: var(--accent-ink); }
.keep { white-space: nowrap; }
.meta { font-size: 0.8rem; color: var(--muted); display: flex; gap: 6px; flex-wrap: wrap; }
.err-box { color: var(--warn); font-size: 0.95rem; margin: 0; }
.cursor { display: inline-block; width: 0.5em; height: 1.05em; background: var(--accent); opacity: 0.6; vertical-align: -0.15em; animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .cursor { animation: none; } }

.sources { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.src { border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; display: grid; gap: 4px; background: var(--bg); }
.src.cited { background: var(--surface); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); }
.src.flash { box-shadow: 0 0 0 3px var(--accent-soft); }
.src .h { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; font-size: 0.86rem; }
.src .n { font: 650 0.75rem/1 var(--sans); color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 3px 7px; }
.src:not(.cited) .n { color: var(--muted); background: var(--line); }
.src .doc-t { font-weight: 600; }
.src .pg { color: var(--muted); }
.src .found { color: var(--muted); font-size: 0.78rem; margin-left: auto; }
.src p { margin: 0; font-size: 0.92rem; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.src.open p { display: block; color: var(--ink); }
.src .acts { display: flex; gap: 12px; }
.src .acts button { border: 0; background: none; padding: 0; color: var(--accent); font-size: 0.82rem; font-weight: 600; }
.also { font-size: 0.8rem; color: var(--muted); margin: 4px 0 0; }

dialog { border: 1px solid var(--line); border-radius: 14px; padding: 0; width: min(760px, calc(100vw - 32px)); max-height: calc(100vh - 64px); background: var(--surface); color: var(--ink); box-shadow: 0 20px 60px rgb(0 0 0 / 25%); }
dialog::backdrop { background: rgb(20 18 12 / 45%); }
.dlg-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 16px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--surface); }
.dlg-head h3 { margin: 0; font-family: var(--serif); font-size: 1.15rem; }
.dlg-head button { border: 0; background: none; font-size: 1.2rem; color: var(--muted); }
.page-text { padding: 18px 22px 26px; white-space: pre-wrap; font-family: var(--serif); font-size: 1rem; line-height: 1.65; margin: 0; }
mark { background: var(--mark); color: inherit; border-radius: 3px; padding: 0 1px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<header>
  <h1 class="brand">PDF <span>Q&amp;A</span></h1>
  <p class="model" id="model">Answers by <b>…</b></p>
</header>
<div class="layout">
  <aside aria-label="Library">
    <p class="label">Your PDFs</p>
    <ul class="docs" id="docs"></ul>
    <div class="drop" id="drop">
      <span>Drop PDFs here</span>
      <button type="button" id="pick">Add PDF</button>
      <input type="file" id="file" accept="application/pdf,.pdf" multiple hidden>
    </div>
    <div class="progress" id="progress" hidden>
      <span id="progress-text"></span>
      <div class="bar"><span id="progress-bar"></span></div>
    </div>
    <p class="note" id="lib-note" role="status"></p>
  </aside>
  <main>
    <form class="ask" id="ask">
      <label class="sr" for="question">Question</label>
      <div class="ask-row">
        <input type="text" id="question" placeholder="Ask about your PDFs…" autocomplete="off" maxlength="500">
        <button class="go" id="go" type="submit">Ask</button>
      </div>
      <div class="scope"><label for="scope">Search in</label><select id="scope"><option value="">All documents</option></select></div>
    </form>
    <section class="empty" id="welcome">
      <h2>Ask a question, get the answer with its pages.</h2>
      <p>Answers come only from your PDFs. Each sentence cites the passage it came from; click a number to see it on its page.</p>
      <div class="tries" id="tries"></div>
    </section>
    <div id="turns" aria-live="polite"></div>
  </main>
</div>
<dialog id="viewer" aria-labelledby="viewer-title">
  <div class="dlg-head"><h3 id="viewer-title"></h3><button type="button" id="viewer-close" aria-label="Close">✕</button></div>
  <p class="page-text" id="viewer-text"></p>
</dialog>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const HEADERS = { "X-Pdfqa": "1" };
const TRIES = ["What are the two tasks BERT is pre-trained on?", "Why divide the dot product by the square root of the dimension?", "How many credit hours does a B.Sc. Major need?"];
let documents = [];
let busy = false;

function el(tag, attrs = {}, ...children) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(attrs)) {
    if (key === "class") node.className = value;
    else if (key.startsWith("on")) node.addEventListener(key.slice(2), value);
    else node.setAttribute(key, value);
  }
  for (const child of children) if (child != null) node.append(child);
  return node;
}
const pages = (c) => c.page_start === c.page_end ? "p. " + c.label_start : "pp. " + c.label_start + "–" + c.label_end;
const plural = (n, word) => n + " " + word + (n === 1 ? "" : "s");

async function* lines(response) {
  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";
  for (;;) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    let cut;
    while ((cut = buffer.indexOf("\n")) >= 0) {
      const line = buffer.slice(0, cut).trim();
      buffer = buffer.slice(cut + 1);
      if (line) yield JSON.parse(line);
    }
  }
}

// Library

async function loadLibrary() {
  const data = await (await fetch("/api/documents")).json();
  documents = data.documents;
  $("model").innerHTML = "";
  $("model").append("Answers by ", el("b", {}, data.model));
  renderLibrary();
}

function renderLibrary() {
  const list = $("docs");
  list.textContent = "";
  for (const doc of documents) {
    const remove = el("button", { class: "x", type: "button", "aria-label": "Remove " + doc.title }, "Remove");
    remove.addEventListener("click", () => removeDoc(doc, remove));
    list.append(el("li", { class: "doc", title: doc.file }, el("span", { class: "t" }, doc.title), remove,
      el("span", { class: "m" }, plural(doc.pages, "page") + " · " + plural(doc.chunks, "passage"))));
  }
  const scope = $("scope"), chosen = scope.value;
  scope.textContent = "";
  scope.append(el("option", { value: "" }, "All documents"));
  for (const doc of documents) scope.append(el("option", { value: String(doc.id) }, doc.title));
  scope.value = documents.some((d) => String(d.id) === chosen) ? chosen : "";
  $("lib-note").textContent = documents.length ? "" : "No PDFs yet. Add one to start.";
  $("lib-note").className = "note";
  const tries = $("tries");
  tries.textContent = "";
  if (documents.length) for (const q of TRIES) tries.append(el("button", { type: "button", onclick: () => { $("question").value = q; ask(); } }, q));
}

async function removeDoc(doc, button) {
  if (!button.classList.contains("sure")) {
    button.classList.add("sure");
    button.textContent = "Sure?";
    setTimeout(() => { button.classList.remove("sure"); button.textContent = "Remove"; }, 3000);
    return;
  }
  const response = await fetch("/api/documents/" + doc.id, { method: "DELETE", headers: HEADERS });
  const data = await response.json();
  note(data.error || "Removed " + doc.title + ".", !!data.error);
  await loadLibrary();
}

function note(text, error = false) {
  $("lib-note").textContent = text;
  $("lib-note").className = "note" + (error ? " err" : "");
}

async function addFiles(files) {
  for (const file of files) {
    if (busy) { note("Wait for the current answer to finish.", true); return; }
    busy = true;
    $("progress").hidden = false;
    setProgress("Uploading " + file.name + "…", 0);
    try {
      const response = await fetch("/api/documents?name=" + encodeURIComponent(file.name), { method: "POST", headers: HEADERS, body: file });
      if (!response.ok) { note((await response.json()).error, true); continue; }
      for await (const line of lines(response)) {
        if (line.stage === "reading") setProgress("Reading " + file.name + ": page " + line.done + " of " + line.total, line.done / line.total * 0.4);
        else if (line.stage === "vectors") setProgress("Indexing: passage " + line.done + " of " + line.total, 0.4 + line.done / line.total * 0.6);
        else if (line.added) note("Added " + line.added.title + ": " + plural(line.added.pages, "page") + ".");
        else if (line.already) note(file.name + " is already here, as " + line.already.title + ".");
        else if (line.error) note(line.error, true);
      }
    } catch (error) {
      note("Couldn't reach pdfqa. Is it still running?", true);
    } finally {
      busy = false;
      $("progress").hidden = true;
    }
    await loadLibrary();
  }
}

function setProgress(text, fraction) {
  $("progress-text").textContent = text;
  $("progress-bar").style.width = Math.round(fraction * 100) + "%";
}

$("pick").addEventListener("click", () => $("file").click());
$("file").addEventListener("change", (e) => { addFiles([...e.target.files]); e.target.value = ""; });
const drop = $("drop");
drop.addEventListener("dragover", (e) => { e.preventDefault(); drop.classList.add("over"); });
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", (e) => {
  e.preventDefault();
  drop.classList.remove("over");
  addFiles([...e.dataTransfer.files].filter((f) => f.name.toLowerCase().endsWith(".pdf")));
});

// Asking

$("ask").addEventListener("submit", (e) => { e.preventDefault(); ask(); });

async function ask() {
  const question = $("question").value.trim();
  if (!question || busy) return;
  busy = true;
  $("go").disabled = true;
  $("welcome").hidden = true;
  const turn = newTurn(question);
  let sources = [], written = "";
  try {
    const response = await fetch("/api/ask", { method: "POST", headers: { ...HEADERS, "Content-Type": "application/json" },
      body: JSON.stringify({ question, doc: $("scope").value ? Number($("scope").value) : null }) });
    if (!response.ok) { turn.fail((await response.json()).error); return; }
    for await (const line of lines(response)) {
      if (line.sources) { sources = line.sources; turn.waiting("Reading " + plural(sources.length, "passage") + "…"); }
      else if (line.text) { written += line.text; turn.write(written, sources, false); }
      else if (line.answer) turn.finish(line.answer, sources);
      else if (line.error) turn.fail(line.error);
    }
  } catch (error) {
    turn.fail("Couldn't reach pdfqa. Is it still running?");
  } finally {
    busy = false;
    $("go").disabled = false;
  }
}

function newTurn(question) {
  const text = el("p", { class: "text waiting" }, "Searching…");
  const meta = el("div", { class: "meta" });
  const list = el("ol", { class: "sources" });
  const holder = el("div", { class: "turn" }, el("h2", { class: "q" }, question), el("div", { class: "a" }, text, meta), list);
  $("turns").prepend(holder);
  return {
    waiting(message) { text.textContent = message; },
    write(value, sources, done) {
      text.className = "text";
      text.textContent = "";
      text.append(...withCitations(value, sources, list));
      if (!done) text.append(el("span", { class: "cursor", "aria-hidden": "true" }));
    },
    finish(answer, sources) {
      this.write(answer.text, sources, true);
      if (!answer.found) text.classList.add("nothing");
      meta.textContent = answer.model + " · " + answer.seconds + " s";
      renderSources(list, sources, answer.cited, answer.found);
    },
    fail(message) {
      text.replaceWith(el("p", { class: "err-box" }, message || "Something went wrong."));
    },
  };
}

// Text with each [n] as a button. The word before a citation, the citation and any punctuation after it
// are kept on one line, so a number never wraps away from its sentence.
function withCitations(value, sources, list) {
  const nodes = [];
  let last = 0, group = null;
  for (const match of value.matchAll(/(\S*?)\s*\[(\d+)\]([.,;:]?)/g)) {
    const n = Number(match[2]);
    if (n < 1 || n > sources.length) continue;
    const joined = match.index === last && group;  // straight after the previous citation, as in [2][3]
    if (!joined) {
      nodes.push(value.slice(last, match.index));
      group = el("span", { class: "keep" }, match[1]);
      nodes.push(group);
    }
    const source = sources[n - 1];
    group.append(el("button", { class: "cite", type: "button", title: source.title + ", " + pages(source), onclick: () => showSource(list, n, sources) }, String(n)), match[3]);
    last = match.index + match[0].length;
  }
  nodes.push(value.slice(last));
  return nodes;
}

function renderSources(list, sources, cited, found) {
  list.textContent = "";
  const order = found ? [...cited, ...sources.map((_, i) => i + 1).filter((n) => !cited.includes(n))] : sources.map((_, i) => i + 1);
  order.forEach((n, i) => {
    const s = sources[n - 1];
    const by = Object.entries(s.ranks).map(([k, r]) => (k === "semantic" ? "meaning" : "keywords") + " #" + r).join(" · ");
    const passage = el("p", {}, s.text);
    const item = el("li", { class: "src" + (cited.includes(n) ? " cited" : "") },
      el("div", { class: "h" }, el("span", { class: "n" }, String(n)), el("span", { class: "doc-t" }, s.title), el("span", { class: "pg" }, pages(s)), el("span", { class: "found" }, by)),
      passage,
      el("div", { class: "acts" },
        el("button", { type: "button", onclick: (e) => { item.classList.toggle("open"); e.target.textContent = item.classList.contains("open") ? "Less" : "Whole passage"; } }, "Whole passage"),
        el("button", { type: "button", onclick: () => showPage(s) }, "Show on the page")));
    if (cited.length && i === cited.length && found) list.append(el("li", {}, el("p", { class: "also" }, "Also read, not cited:")));
    list.append(item);
  });
}

function showSource(list, n, sources) {
  const item = [...list.children].find((li) => li.querySelector(".n")?.textContent === String(n));
  if (!item) { showPage(sources[n - 1]); return; }
  item.scrollIntoView({ behavior: "smooth", block: "nearest" });
  item.classList.add("flash");
  setTimeout(() => item.classList.remove("flash"), 1200);
}

async function showPage(source) {
  const data = await (await fetch("/api/pages/" + source.document_id + "/" + source.page_start)).json();
  $("viewer-title").textContent = source.title + ", page " + data.label;
  const box = $("viewer-text");
  box.textContent = "";
  const text = data.text || "(No text on this page.)";
  const [start, end] = locate(text, source.text);
  if (start < 0) box.append(text);
  else box.append(text.slice(0, start), el("mark", {}, text.slice(start, end)), text.slice(end));
  $("viewer").showModal();
  box.querySelector("mark")?.scrollIntoView({ block: "center" });
}

// Where a passage sits on its page: find its first words, then its last words if they're on this page too.
function locate(page, passage) {
  const words = passage.split(/\s+/).filter(Boolean);
  const pattern = (list) => new RegExp(list.map((w) => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&")).join("\\s+"));
  const head = page.match(pattern(words.slice(0, 6)));
  if (!head) return [-1, -1];
  const rest = page.slice(head.index);
  const tail = rest.match(pattern(words.slice(-6)));
  return [head.index, tail ? head.index + tail.index + tail[0].length : page.length];
}

$("viewer-close").addEventListener("click", () => $("viewer").close());
$("viewer").addEventListener("click", (e) => { if (e.target === $("viewer")) $("viewer").close(); });

loadLibrary().catch(() => note("Couldn't reach pdfqa. Is it still running?", true));
</script>
</body>
</html>
