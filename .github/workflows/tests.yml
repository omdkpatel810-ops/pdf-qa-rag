name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Run tests with coverage (fails under 95%)
        run: python -m pytest -v --cov --cov-report=term-missing

  model:
    # The real models: bge-small-en-v1.5 (133 MB) and Qwen3-1.7B (2.1 GB), cached between runs.
    name: real models (bge-small, Qwen3-1.7B)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: bge-small-en-v1.5-5c38ec7-qwen3-1.7b-q4-3231b52
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Run the models' tests
        env:
          PDFQA_REAL_MODEL: "1"
        run: python -m pytest -v tests/test_model.py
