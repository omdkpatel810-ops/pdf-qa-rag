[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-qa-rag"
version = "0.1.0"
description = "Ask questions about your PDFs and get answers with page citations."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Om Patel" }]
dependencies = [
    "pypdf[crypto]>=5.1",
    "numpy>=1.24",
    "onnxruntime>=1.17",  # runs the embedding model, without PyTorch
    "tokenizers>=0.15",
    "huggingface-hub>=0.20",  # downloads the model once and caches it
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6.100", "reportlab>=4", "ruff>=0.6"]

[project.urls]
Repository = "https://github.com/omdkpatel810-ops/pdf-qa-rag"

[project.scripts]
pdfqa = "pdfqa.cli:main"

[tool.setuptools]
packages = ["pdfqa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["pdfqa"]
omit = ["pdfqa/__main__.py"]

[tool.coverage.report]
show_missing = true
fail_under = 95

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]  # the formatter decides line length
